name: Open Jev Colab runner

on:
  pull_request:
    paths:
      - "experiments/context_selection/run_open_jev_colab.py"
      - "experiments/context_selection/test_run_open_jev_colab.py"
      - ".github/workflows/context-selection-open-jev-colab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test one-shot runner without GPU/model download
        working-directory: experiments/context_selection
        run: python -m unittest -v test_run_open_jev_colab.py
