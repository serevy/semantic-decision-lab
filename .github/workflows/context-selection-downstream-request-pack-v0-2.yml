name: Context selection downstream request pack v0.2 preview

on:
  pull_request:
    paths:
      - "experiments/context_selection/downstream-cases.v0.2.json"
      - "experiments/context_selection/downstream-arms.v0.2.json"
      - "experiments/context_selection/downstream-evaluation-contract.v0.2.json"
      - "experiments/context_selection/build_downstream_requests_v0_2.py"
      - "experiments/context_selection/downstream-request-pack.v0.2.json"
      - "experiments/context_selection/validate_downstream_results_v0_2.py"
      - "experiments/context_selection/prepare_downstream_evaluator_input_v0_2.py"
      - "experiments/context_selection/evaluate_downstream_v0_2.py"
      - ".github/workflows/context-selection-downstream-request-pack-v0-2.yml"

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build deterministic v0.2 request pack
        run: |
          python experiments/context_selection/validate_downstream_v0_2_freeze.py
          python experiments/context_selection/build_downstream_requests_v0_2.py --check
          python experiments/context_selection/build_downstream_requests_v0_2.py \
            --output "$RUNNER_TEMP/downstream-requests.v0.2.jsonl"
          sha256sum "$RUNNER_TEMP/downstream-requests.v0.2.jsonl"
          wc -l "$RUNNER_TEMP/downstream-requests.v0.2.jsonl"
          wc -c "$RUNNER_TEMP/downstream-requests.v0.2.jsonl"
      - name: Upload request-pack preview
        uses: actions/upload-artifact@v4
        with:
          name: context-selection-downstream-request-pack-v0.2-preview
          path: ${{ runner.temp }}/downstream-requests.v0.2.jsonl
          if-no-files-found: error
          retention-days: 7
