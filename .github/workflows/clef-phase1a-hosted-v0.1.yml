name: Clef-Flash Phase 1A hosted v0.1

on:
  push:
    branches:
      - "experiment/clef-phase1a-hosted-v0-1"
    paths:
      - ".github/workflows/clef-phase1a-hosted-v0.1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase1a:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AUTH_TOKEN: ${{ secrets.CLOUDFLARE_AUTH_TOKEN }}
      RESULT_DIR: evidence/clef-phase1a-hosted-v0.1

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify live-run credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID}" || -z "${CLOUDFLARE_AUTH_TOKEN}" ]]; then
            echo "::error::Cloudflare Workers AI repository secrets are not configured."
            exit 2
          fi

      - name: Validate frozen Phase 1A matrix before external calls
        working-directory: experiments/provider_portability/clef
        run: python -m unittest -v phase1a/test_phase1a.py

      - name: Run frozen 14-probe hosted matrix
        shell: bash
        run: |
          set -euo pipefail
          python experiments/provider_portability/clef/phase1a/run_workers_ai.py \
            --output-dir "${RESULT_DIR}"

      - name: Analyze frozen metrics
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python experiments/provider_portability/clef/phase1a/analyze.py \
            --results-dir "${RESULT_DIR}" \
            --output "${RESULT_DIR}/analysis.v0.1.json"
          python -m json.tool "${RESULT_DIR}/analysis.v0.1.json" > /dev/null

      - name: Write run summary
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RESULT_DIR"])
          analysis = json.loads((root / "analysis.v0.1.json").read_text(encoding="utf-8"))
          comparisons = analysis["comparisons"]
          rows = []
          for variant, metrics in comparisons.items():
              for question, values in metrics.items():
                  rows.append((variant, question, values))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("## Clef-Flash Phase 1A hosted v0.1\n\n")
              out.write(f"Comparisons: {len(comparisons)} variants against packed-canonical.\n\n")
              flips = [(v, q) for v, q, m in rows if m.get("top_choice_flip")]
              out.write(f"Top-choice flips: {len(flips)}\n")
          PY

      - name: Upload Phase 1A Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clef-phase1a-hosted-v0.1-evidence
          path: evidence/clef-phase1a-hosted-v0.1
          if-no-files-found: warn
          retention-days: 30
