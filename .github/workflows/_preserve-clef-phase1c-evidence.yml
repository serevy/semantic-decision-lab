name: Preserve Clef Phase 1C Evidence

on:
  push:
    branches:
      - evidence/clef-phase1c-hosted-v0-1

permissions:
  actions: read
  contents: write

concurrency:
  group: preserve-clef-phase1c-evidence
  cancel-in-progress: false

jobs:
  preserve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download frozen Phase 1C artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/11305000613/zip" \
            -o /tmp/clef-phase1c.zip
          echo "06ea548d2aedd9a4bf305a2ae9c21220b0530cfc6c2fe894118e122beeb62c1f  /tmp/clef-phase1c.zip" | sha256sum -c -
          rm -rf /tmp/clef-phase1c
          mkdir -p /tmp/clef-phase1c
          unzip -q /tmp/clef-phase1c.zip -d /tmp/clef-phase1c

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/11304537926/zip" \
            -o /tmp/clef-phase1b.zip
          echo "3cef7569014381bd33574657e892b5f1034f29281fd6c917fe0ce6b2f9752629  /tmp/clef-phase1b.zip" | sha256sum -c -
          rm -rf /tmp/clef-phase1b
          mkdir -p /tmp/clef-phase1b
          unzip -q /tmp/clef-phase1b.zip -d /tmp/clef-phase1b

      - name: Validate and build durable bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib
          import json

          repo = Path(".")
          artifact = Path("/tmp/clef-phase1c")
          results = repo / "experiments/provider_portability/clef/results"

          run_summary = json.loads((artifact / "run-summary.json").read_text(encoding="utf-8"))
          analysis = json.loads((artifact / "analysis.v0.1.json").read_text(encoding="utf-8"))

          assert run_summary["manifest_sha256"] == "931786cbb8a53d8883e51ebdbe36f27cf3c9c49a4fb3b05684fd26997694b00d"
          assert run_summary["expected_provider_calls"] == 54
          assert len(run_summary["completed_calls"]) == 54
          assert run_summary["failures"] == []
          assert analysis["repeatability_summary"] == {
              "byte_identical_repeat_conditions": 18,
              "total_conditions": 18,
          }

          records = []
          conditions = {}
          for p in sorted(artifact.glob("*/*/repeat-*.json")):
              d = json.loads(p.read_text(encoding="utf-8"))
              fixture, variant, _ = p.relative_to(artifact).parts
              repeat = int(p.stem.rsplit("-", 1)[1])

              assert d["stage"] == "validated"
              assert d["http_status"] == 200
              raw = base64.b64decode(d["raw_response_base64"])
              assert hashlib.sha256(raw).hexdigest() == d["raw_response_sha256"]

              key = (fixture, variant)
              c = conditions.setdefault(
                  key,
                  {"raw": set(), "request": set(), "wire": set(), "repeats": set()},
              )
              c["raw"].add(d["raw_response_sha256"])
              c["request"].add(d["request_sha256"])
              c["wire"].add(d["wire_request_sha256"])
              c["repeats"].add(repeat)

              records.append({
                  "fixture": fixture,
                  "variant": variant,
                  "repeat": repeat,
                  "observed_at_utc": d["observed_at_utc"],
                  "completed_at_utc": d["completed_at_utc"],
                  "provider": d["provider"],
                  "model_id": d["model_id"],
                  "hosted_model_revision": d["hosted_model_revision"],
                  "request_sha256": d["request_sha256"],
                  "wire_request_sha256": d["wire_request_sha256"],
                  "stage": d["stage"],
                  "http_status": d["http_status"],
                  "elapsed_ms_client_observed": d["elapsed_ms_client_observed"],
                  "raw_response_sha256": d["raw_response_sha256"],
                  "raw_response_base64": d["raw_response_base64"],
              })

          assert len(records) == 54
          assert len(conditions) == 18
          assert all(
              len(v["raw"]) == 1
              and len(v["request"]) == 1
              and len(v["wire"]) == 1
              and v["repeats"] == {1, 2, 3}
              for v in conditions.values()
          )

          phase1b_root = Path("/tmp/clef-phase1b")
          known_fixtures = set(analysis["fixtures"])
          known_variants = {variant for _, variant in conditions}
          phase1b_map = {}

          for p in sorted(phase1b_root.rglob("*.json")):
              try:
                  d = json.loads(p.read_text(encoding="utf-8"))
              except (UnicodeDecodeError, json.JSONDecodeError):
                  continue
              if not isinstance(d, dict) or "raw_response_sha256" not in d:
                  continue

              rel_parts = p.relative_to(phase1b_root).parts
              fixture = d.get("fixture")
              variant = d.get("variant")

              if fixture not in known_fixtures:
                  fixture = next((part for part in rel_parts if part in known_fixtures), None)
              if variant not in known_variants:
                  candidates = list(rel_parts) + [p.stem]
                  variant = next((part for part in candidates if part in known_variants), None)

              if fixture and variant:
                  phase1b_map[(fixture, variant)] = d["raw_response_sha256"]

          assert len(phase1b_map) == 18

          phase1c_map = {
              (r["fixture"], r["variant"]): r["raw_response_sha256"]
              for r in records
              if r["repeat"] == 1
          }

          comparisons = []
          for key in sorted(phase1c_map):
              if key not in phase1b_map:
                  continue
              fixture, variant = key
              comparisons.append({
                  "fixture": fixture,
                  "variant": variant,
                  "phase1b_raw_response_sha256": phase1b_map[key],
                  "phase1c_repeat1_raw_response_sha256": phase1c_map[key],
                  "match": phase1b_map[key] == phase1c_map[key],
              })

          assert len(comparisons) == 18
          assert all(x["match"] for x in comparisons)

          bundle = {
              "schema_version": "0.1",
              "experiment": "clef-flash-phase1c-question-order-repeatability",
              "run_identity": {
                  "workflow_run": 37206425338,
                  "workflow_head": "22eee3e0b531f89303ce78b6f54d41eea0516271",
                  "artifact_id": 11305000613,
                  "artifact_digest": "sha256:06ea548d2aedd9a4bf305a2ae9c21220b0530cfc6c2fe894118e122beeb62c1f",
                  "manifest_sha256": run_summary["manifest_sha256"],
                  "provider": "cloudflare-workers-ai",
                  "model_alias": "@cf/cloudflare/clef-flash",
                  "hosted_immutable_model_revision": None,
              },
              "phase1b_cross_workflow": {
                  "workflow_run": 37205657656,
                  "matched_raw_response_sha256": 18,
                  "total_compared": 18,
                  "comparisons": comparisons,
              },
              "run_summary": run_summary,
              "analysis": analysis,
              "records": records,
          }

          raw = json.dumps(
              bundle, ensure_ascii=False, separators=(",", ":")
          ).encode("utf-8")
          gz = gzip.compress(raw, compresslevel=9, mtime=0)
          b64 = base64.b64encode(gz) + b"\n"

          raw_sha = hashlib.sha256(raw).hexdigest()
          gz_sha = hashlib.sha256(gz).hexdigest()
          b64_sha = hashlib.sha256(b64).hexdigest()

          bundle_path = results / "clef-phase1c-hosted-v0.1.bundle.json.gz.b64"
          bundle_path.write_bytes(b64)

          for old in results.glob("clef-phase1c-hosted-v0.1.bundle.json.gz.b64.part-*"):
              old.unlink()

          summary_path = results / "clef-phase1c-hosted-v0.1-summary.md"
          summary = summary_path.read_text(encoding="utf-8")
          marker = "## Raw Evidence bundle\n"
          assert marker in summary
          summary = summary.split(marker, 1)[0] + marker + f"""
          `clef-phase1c-hosted-v0.1.bundle.json.gz.b64` is a gzip-compressed,
          Base64-encoded compact Evidence bundle containing:

          - all 54 exact provider response bodies as `raw_response_base64`;
          - request and wire hashes plus repeat identity;
          - run and artifact identity;
          - the full Phase 1C analysis object;
          - the 18 / 18 Phase 1B → Phase 1C raw-response SHA-256 comparisons.

          Integrity:

          - uncompressed compact JSON SHA-256:
            `{raw_sha}`
          - decoded gzip SHA-256:
            `{gz_sha}`
          - Base64 text SHA-256:
            `{b64_sha}`

          Example reconstruction:

          ```bash
          base64 -d clef-phase1c-hosted-v0.1.bundle.json.gz.b64 |
            gzip -d > clef-phase1c-hosted-v0.1.bundle.json
          ```
          """
          import textwrap
          summary = summary.split(marker, 1)[0] + marker + textwrap.dedent(summary.split(marker, 1)[1])
          summary_path.write_text(summary, encoding="utf-8")

          print(f"records={len(records)}")
          print(f"conditions={len(conditions)}")
          print(f"phase1b_matches={sum(x['match'] for x in comparisons)}/{len(comparisons)}")
          print(f"bundle_raw_sha256={raw_sha}")
          print(f"bundle_gzip_sha256={gz_sha}")
          print(f"bundle_base64_sha256={b64_sha}")
          PY

      - name: Validate generated Evidence
        run: |
          set -euo pipefail
          python -m json.tool experiments/provider_portability/clef/results/clef-phase1c-hosted-v0.1-analysis-summary.json >/dev/null
          test -s experiments/provider_portability/clef/results/clef-phase1c-hosted-v0.1.bundle.json.gz.b64
          test ! -e experiments/provider_portability/clef/results/clef-phase1c-hosted-v0.1.bundle.json.gz.b64.part-00
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, json
          p = Path("experiments/provider_portability/clef/results/clef-phase1c-hosted-v0.1.bundle.json.gz.b64")
          d = json.loads(gzip.decompress(base64.b64decode(p.read_bytes())))
          assert len(d["records"]) == 54
          assert d["phase1b_cross_workflow"]["matched_raw_response_sha256"] == 18
          assert d["phase1b_cross_workflow"]["total_compared"] == 18
          PY

      - name: Commit durable Evidence and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/_preserve-clef-phase1c-evidence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "evidence: preserve Clef-Flash Phase 1C raw bundle"
          git push origin HEAD:${GITHUB_REF_NAME}
