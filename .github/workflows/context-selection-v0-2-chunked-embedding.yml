name: Context selection v0.2 chunked embedding

on:
  pull_request:
    paths:
      - "experiments/context_selection/cases.v0.2.json"
      - "experiments/context_selection/corpus-registry.v0.2.json"
      - "experiments/context_selection/corpus/**"
      - "experiments/context_selection/embedding-chunked-condition.v0.2.json"
      - "experiments/context_selection/run_embedding_chunked_experiment_v0_2.py"
      - "experiments/context_selection/evaluate_context_selection.py"
      - "experiments/context_selection/requirements-embedding.txt"
      - ".github/workflows/context-selection-v0-2-chunked-embedding.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  chunked-embedding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: experiments/context_selection/requirements-embedding.txt
      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5-small-fd1525a9-v02
      - name: Install embedding dependencies
        run: pip install -r experiments/context_selection/requirements-embedding.txt
      - name: Validate dataset v0.2
        run: python experiments/context_selection/validate_dataset_v0_2.py
      - name: Run frozen chunked embedding condition
        run: python experiments/context_selection/run_embedding_chunked_experiment_v0_2.py
      - name: Upload chunked embedding evidence
        uses: actions/upload-artifact@v4
        with:
          name: context-selection-embedding-chunked-v0.2
          path: experiments/context_selection/results/embedding-chunked-v0.2/
