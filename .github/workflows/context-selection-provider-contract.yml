name: Semantic provider contract

on:
  pull_request:
    paths:
      - "experiments/context_selection/semantic_provider.py"
      - "experiments/context_selection/test_semantic_provider.py"
      - ".github/workflows/context-selection-provider-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run provider contract tests
        working-directory: experiments/context_selection
        run: python -m unittest -v test_semantic_provider.py
