name: Clef provider contract

on:
  pull_request:
    paths:
      - "experiments/provider_portability/**"
      - ".github/workflows/clef-provider-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate offline Clef contract and smoke helpers
        working-directory: experiments/provider_portability/clef
        run: python -m unittest -v test_contract.py test_smoke_runners.py phase1a/test_phase1a.py phase1b/test_phase1b.py phase1c/test_phase1c.py phase2a/test_phase2a.py phase2b/test_phase2b.py phase2c/test_phase2c.py
      - name: Validate Workers AI request construction without credentials
        run: |
          python experiments/provider_portability/clef/run_workers_ai_smoke.py \
            --dry-run > "$RUNNER_TEMP/clef-workers-ai-dry-run.json"
          python -m json.tool "$RUNNER_TEMP/clef-workers-ai-dry-run.json" > /dev/null
      - name: Validate Phase 2A local protocol without GPU/model output
        run: |
          python experiments/provider_portability/clef/phase2a/run_local.py \
            --dry-run > "$RUNNER_TEMP/clef-phase2a-dry-run.json"
          python -m json.tool "$RUNNER_TEMP/clef-phase2a-dry-run.json" > /dev/null
      - name: Validate Phase 2B and Phase 2C local protocols without GPU/model output
        run: |
          python experiments/provider_portability/clef/phase2b/run_local.py \
            --dry-run > "$RUNNER_TEMP/clef-phase2b-dry-run.json"
          python -m json.tool "$RUNNER_TEMP/clef-phase2b-dry-run.json" > /dev/null
          python experiments/provider_portability/clef/phase2c/run_local.py \
            --dry-run > "$RUNNER_TEMP/clef-phase2c-dry-run.json"
          python -m json.tool "$RUNNER_TEMP/clef-phase2c-dry-run.json" > /dev/null
      - name: Compile smoke runners
        run: |
          python -m py_compile \
            experiments/provider_portability/clef/contract.py \
            experiments/provider_portability/clef/evidence_io.py \
            experiments/provider_portability/clef/run_workers_ai_smoke.py \
            experiments/provider_portability/clef/run_local_clef_flash_smoke.py \
            experiments/provider_portability/clef/phase1a/probes.py \
            experiments/provider_portability/clef/phase1a/analyze.py \
            experiments/provider_portability/clef/phase1a/run_workers_ai.py \
            experiments/provider_portability/clef/phase1b/probes.py \
            experiments/provider_portability/clef/phase1b/analyze.py \
            experiments/provider_portability/clef/phase1b/run_workers_ai.py \
            experiments/provider_portability/clef/phase1c/probes.py \
            experiments/provider_portability/clef/phase1c/analyze.py \
            experiments/provider_portability/clef/phase1c/run_workers_ai.py \
            experiments/provider_portability/clef/phase2a/probes.py \
            experiments/provider_portability/clef/phase2a/run_local.py \
            experiments/provider_portability/clef/phase2a/analyze.py \
            experiments/provider_portability/clef/phase2b/probes.py \
            experiments/provider_portability/clef/phase2b/run_local.py \
            experiments/provider_portability/clef/phase2b/analyze.py \
            experiments/provider_portability/clef/phase2c/probes.py \
            experiments/provider_portability/clef/phase2c/run_local.py \
            experiments/provider_portability/clef/phase2c/analysis_plan.py \
            experiments/provider_portability/clef/phase2c/analyze.py
