name: Clef provider contract

on:
  pull_request:
    paths:
      - "experiments/provider_portability/**"
      - ".github/workflows/clef-provider-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate offline Clef contract
        working-directory: experiments/provider_portability/clef
        run: python -m unittest -v test_contract.py
      - name: Validate Workers AI request construction without credentials
        run: |
          python experiments/provider_portability/clef/run_workers_ai_smoke.py \
            --dry-run > "$RUNNER_TEMP/clef-workers-ai-dry-run.json"
          python -m json.tool "$RUNNER_TEMP/clef-workers-ai-dry-run.json" > /dev/null
      - name: Compile local smoke runner
        run: |
          python -m py_compile \
            experiments/provider_portability/clef/contract.py \
            experiments/provider_portability/clef/run_local_clef_flash_smoke.py
