name: README i18n

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - .i18n/**
      - .github/workflows/readme-i18n.yml

  workflow_dispatch:
    inputs:
      target:
        description: Target language
        required: true
        default: all
        type: choice
        options:
          - all
          - ja
          - zh-CN
          - ko
          - fr

permissions:
  contents: read

# The OpenAI project currently has a 10 RPM limit. Serialize automatic and
# manual runs so they cannot consume the shared project quota concurrently.
concurrency:
  group: readme-i18n
  cancel-in-progress: false

jobs:
  translate:
    name: translate-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all' }}
    runs-on: ubuntu-latest
    env:
      TARGET_LANG: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all' }}
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.19.0'

      - name: Test request guard without API access
        run: node --test .i18n/translation-fetch-guard.test.mjs

      - name: Checkout pinned md-translator source
        env:
          MD_TRANSLATOR_SHA: 25d07cebc70266ed06bcfb7e5e1ef97253c3e998
        run: |
          git clone --filter=blob:none https://github.com/rockbenben/md-translator.git "$RUNNER_TEMP/md-translator"
          git -C "$RUNNER_TEMP/md-translator" checkout --detach "$MD_TRANSLATOR_SHA"

      - name: Apply whole-line Markdown patch
        run: |
          node .i18n/apply-md-translator-whole-line-patch.mjs "$RUNNER_TEMP/md-translator"
          grep -Fq "README i18n whole-line mode" "$RUNNER_TEMP/md-translator/src/app/lib/translation/cliFormat.ts"

      - name: Install pinned translator dependencies
        working-directory: ${{ runner.temp }}/md-translator
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Translate canonical README
        working-directory: ${{ runner.temp }}/md-translator
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          README_I18N_FETCH_GUARD: '1'
        run: |
          set -eu

          case "$TARGET_LANG" in
            all)
              targets=(ja zh-CN ko fr)
              ;;
            ja|zh-CN|ko|fr)
              targets=("$TARGET_LANG")
              ;;
            *)
              echo "::error::Unsupported target language: $TARGET_LANG"
              exit 1
              ;;
          esac

          test -n "$OPENAI_API_KEY" || {
            echo "::error::Repository secret OPENAI_API_KEY is required."
            exit 1
          }

          settings_file="$(mktemp "$RUNNER_TEMP/readme-i18n-settings.XXXXXX.json")"
          trap 'rm -f "$settings_file"' EXIT
          python - "$GITHUB_WORKSPACE/.i18n/readme-translation-settings.json" "$settings_file" <<'PY'
          import json, os, sys
          from pathlib import Path

          source = Path(sys.argv[1])
          output = Path(sys.argv[2])

          settings = json.loads(source.read_text(encoding="utf-8"))
          settings["translationConfigs"]["openai"]["apiKey"] = os.environ["OPENAI_API_KEY"]

          output.touch(mode=0o600)
          output.write_text(json.dumps(settings), encoding="utf-8")
          output.chmod(0o600)
          PY
          unset OPENAI_API_KEY

          rm -rf "$GITHUB_WORKSPACE/i18n-output"
          mkdir -p "$GITHUB_WORKSPACE/i18n-output"

          if [ "$TARGET_LANG" = "all" ]; then
            export README_I18N_MAX_REQUESTS=80
          else
            export README_I18N_MAX_REQUESTS=60
          fi

          target_args=()
          for lang in "${targets[@]}"; do
            target_args+=(-t "$lang")
          done

          # One CLI process handles all selected languages. The global fetch
          # guard therefore paces and counts requests across the entire run.
          node --import "$GITHUB_WORKSPACE/.i18n/translation-fetch-guard.mjs" --import tsx scripts/cli.ts \
            -i "$GITHUB_WORKSPACE/README.md" \
            -f en "${target_args[@]}" -m openai \
            -s "$settings_file" \
            --model gpt-5.6-luna \
            --no-relay --no-context --no-cache \
            -o "$GITHUB_WORKSPACE/i18n-output"

      - name: Verify Markdown structure and protected terms
        run: |
          set -eu

          case "$TARGET_LANG" in
            all)
              targets=(ja zh-CN ko fr)
              ;;
            ja|zh-CN|ko|fr)
              targets=("$TARGET_LANG")
              ;;
            *)
              echo "::error::Unsupported target language: $TARGET_LANG"
              exit 1
              ;;
          esac

          for lang in "${targets[@]}"; do
            translated="i18n-output/README.${lang}.md"
            test -s "$translated" || {
              echo "::error::Expected translated README is missing: $translated"
              exit 1
            }
            python .i18n/verify-readme-translation.py README.md "$translated"
          done

          mapfile -t generated < <(find i18n-output -maxdepth 1 -type f -name 'README.*.md' -print)
          if [ "${#generated[@]}" -ne "${#targets[@]}" ]; then
            echo "::error::Expected ${#targets[@]} translated README file(s), found ${#generated[@]}"
            printf '%s\n' "${generated[@]}"
            exit 1
          fi

      - name: Upload translation for human review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: readme-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all' }}
          path: i18n-output/
          if-no-files-found: warn
          retention-days: 7
