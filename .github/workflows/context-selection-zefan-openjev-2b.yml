name: Zefan Open-Jev 2B v0.1 adapter

on:
  pull_request:
    paths:
      - "experiments/context_selection/zefan_openjev_2b_provider.py"
      - "experiments/context_selection/test_zefan_openjev_2b_provider.py"
      - "experiments/context_selection/diagnose_zefan_openjev_2b_input.py"
      - "experiments/context_selection/run_zefan_openjev_2b_experiment.py"
      - "experiments/context_selection/run_zefan_openjev_2b_colab.py"
      - "experiments/context_selection/test_zefan_openjev_2b_colab_runner.py"
      - "experiments/context_selection/zefan_openjev_2b_v0_1_colab.ipynb"
      - "experiments/context_selection/ZEFAN_OPENJEV_2B_V01_RUNBOOK.md"
      - "experiments/context_selection/providers/zefan-open-jev-2b-v0.1.json"
      - "experiments/context_selection/test_colab_notebooks.py"
      - ".github/workflows/context-selection-zefan-openjev-2b.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tokenizer dependencies
        run: |
          pip install "transformers==5.10.2" "huggingface_hub==1.29.0" "jinja2==3.1.6"
      - name: Clone pinned Zefan Open-Jev source
        run: |
          git clone https://github.com/Zefan-Cai/Open-Jev.git /tmp/zefan-open-jev
          git -C /tmp/zefan-open-jev checkout --detach ed45657bf726c3b77408942830e5578f99df904e
      - name: Test adapter and scripts
        working-directory: experiments/context_selection
        run: |
          python -m unittest -v test_semantic_provider.py
          python -m unittest -v test_zefan_openjev_2b_provider.py
          python -m unittest -v test_zefan_openjev_2b_colab_runner.py
          python test_colab_notebooks.py
          python -m py_compile diagnose_zefan_openjev_2b_input.py
          python -m py_compile run_zefan_openjev_2b_experiment.py
          python -m py_compile run_zefan_openjev_2b_colab.py
      - name: Preflight exact candidate packing
        working-directory: experiments/context_selection
        run: |
          python diagnose_zefan_openjev_2b_input.py \
            cases.v0.1.json \
            corpus/pddr-kit-v0.1 \
            --source-dir /tmp/zefan-open-jev \
            --output /tmp/zefan-open-jev-2b-v0.1-input-preflight.json
      - name: Upload preflight
        uses: actions/upload-artifact@v4
        with:
          name: zefan-open-jev-2b-v0.1-input-preflight
          path: /tmp/zefan-open-jev-2b-v0.1-input-preflight.json
