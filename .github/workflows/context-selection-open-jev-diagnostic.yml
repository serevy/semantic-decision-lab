name: Diagnose Open Jev v0.1 input packing

on:
  pull_request:
    paths:
      - "experiments/context_selection/diagnose_open_jev_v01_input.py"
      - ".github/workflows/context-selection-open-jev-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tokenizer dependency
        run: pip install "transformers==5.16.1"
      - name: Clone pinned Open Jev revision
        run: |
          git clone https://github.com/intikhab49/open-jev-typed-decision-engine.git /tmp/open-jev
          git -C /tmp/open-jev checkout 78d3b3a171f24d8d9a8dea18e027f9d3373fda45
      - name: Run input-packing diagnostic
        working-directory: experiments/context_selection
        run: |
          python diagnose_open_jev_v01_input.py \
            cases.v0.1.json \
            corpus/pddr-kit-v0.1 \
            --upstream-dir /tmp/open-jev \
            --output /tmp/open-jev-v0.1-input-diagnostic.json
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: open-jev-v0.1-input-diagnostic
          path: /tmp/open-jev-v0.1-input-diagnostic.json
