name: Validate PDDR records

on:
  pull_request:
    paths:
      - ".pddr/**"
      - "docs/records/**"
      - ".github/workflows/pddr.yml"
  push:
    branches:
      - main
    paths:
      - ".pddr/**"
      - "docs/records/**"
      - ".github/workflows/pddr.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate records
        run: python .pddr/pddr.py validate
