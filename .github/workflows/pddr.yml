name: Validate PDDR records

on:
  pull_request:
    paths:
      - ".pddr/**"
      - "docs/records/**"
      - ".github/workflows/pddr.yml"
  push:
    branches:
      - main
    paths:
      - ".pddr/**"
      - "docs/records/**"
      - ".github/workflows/pddr.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate records
        run: python .pddr/pddr.py validate
