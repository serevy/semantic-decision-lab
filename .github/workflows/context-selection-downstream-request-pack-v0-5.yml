name: Context selection downstream request pack v0.5 preview

on:
  pull_request:
    paths:
      - "experiments/context_selection/downstream-cases.v0.5.json"
      - "experiments/context_selection/downstream-arms.v0.5.json"
      - "experiments/context_selection/downstream-counterfactual-fixtures.v0.5.json"
      - "experiments/context_selection/downstream-evaluation-contract.v0.5.json"
      - "experiments/context_selection/build_downstream_requests_v0_5.py"
      - "experiments/context_selection/downstream-request-pack.v0.5.json"
      - "experiments/context_selection/validate_downstream_results_v0_5.py"
      - "experiments/context_selection/prepare_downstream_evaluator_input_v0_5.py"
      - "experiments/context_selection/evaluate_downstream_v0_5.py"
      - ".github/workflows/context-selection-downstream-request-pack-v0-5.yml"

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build deterministic v0.5 request pack
        run: |
          python experiments/context_selection/validate_downstream_v0_5_freeze.py
          python experiments/context_selection/build_downstream_requests_v0_5.py --check
          python experiments/context_selection/build_downstream_requests_v0_5.py \
            --output "$RUNNER_TEMP/downstream-requests.v0.5.jsonl"
          sha256sum "$RUNNER_TEMP/downstream-requests.v0.5.jsonl"
          wc -l "$RUNNER_TEMP/downstream-requests.v0.5.jsonl"
          wc -c "$RUNNER_TEMP/downstream-requests.v0.5.jsonl"
      - name: Smoke evaluator semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("experiments/context_selection")
          cases={c["case_id"]:c for c in json.loads((root/"downstream-cases.v0.5.json").read_text())}
          arms=json.loads((root/"downstream-arms.v0.5.json").read_text())
          answers={}
          answers["no_context"]={cid:{"choice":"ABSTAIN"} for cid in arms["pair_controls"]["no_context"]["case_ids"]}
          answers["correct_card"]={cid:{"choice":cases[cid]["gold"]["choice"]} for cid in arms["pair_controls"]["correct_card"]["case_ids"]}
          for name,spec in arms["real_side_controls"].items():
              answers[name]={cid:{"choice":cases[cid]["gold"]["choice"]} for cid in spec["case_ids"]}
          for name,spec in arms["historical_retrieval"].items():
              answers[name]={}
              for cid in spec["case_ids"]:
                  required=cases[cid]["gold"]["required_record"]
                  choice=cases[cid]["gold"]["choice"] if required in spec["selections"][cid] else "ABSTAIN"
                  answers[name][cid]={"choice":choice}
          Path("/tmp/v05-smoke.json").write_text(json.dumps({"run":{"kind":"smoke"},"answers":answers}))
          PY
          python experiments/context_selection/evaluate_downstream_v0_5.py /tmp/v05-smoke.json > /tmp/v05-eval.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/v05-eval.json"))
          assert data["control_gate"]["pass"] is True
          assert data["correct_card_matched_pair_flips"]["count"] == 6
          print("downstream v0.5 evaluator smoke valid")
          PY
      - name: Upload request-pack preview
        uses: actions/upload-artifact@v7
        with:
          name: context-selection-downstream-request-pack-v0.5-preview
          path: ${{ runner.temp }}/downstream-requests.v0.5.jsonl
          if-no-files-found: error
          retention-days: 7
