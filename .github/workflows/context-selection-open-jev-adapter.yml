name: Open Jev provider adapter

on:
  pull_request:
    paths:
      - "experiments/context_selection/open_jev_http_provider.py"
      - "experiments/context_selection/run_open_jev_experiment.py"
      - "experiments/context_selection/test_open_jev_http_provider.py"
      - ".github/workflows/context-selection-open-jev-adapter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run adapter tests
        working-directory: experiments/context_selection
        run: |
          python -m unittest -v test_semantic_provider.py
          python -m unittest -v test_open_jev_http_provider.py
