name: Repair Clef Phase 1B bundle

on:
  push:
    branches:
      - evidence/clef-phase1c-hosted-v0-1
    paths:
      - .github/workflows/repair-clef-phase1b-bundle.yml

permissions:
  contents: write
  actions: read

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: evidence/clef-phase1c-hosted-v0-1
          fetch-depth: 0

      - name: Download and verify frozen Phase 1B artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location             --header "Authorization: Bearer ${GH_TOKEN}"             --header "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/11304537926/zip"             --output /tmp/phase1b.zip
          echo "3cef7569014381bd33574657e892b5f1034f29281fd6c917fe0ce6b2f9752629  /tmp/phase1b.zip" | sha256sum --check
          mkdir -p /tmp/phase1b
          unzip -q /tmp/phase1b.zip -d /tmp/phase1b

      - name: Reconstruct and verify durable bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib
          import json
          import re

          root = Path("/tmp/phase1b")
          results = Path("experiments/provider_portability/clef/results")
          responses = {}

          for path in sorted(root.rglob("*.json")):
              if path.name in {"analysis.v0.1.json", "run-summary.json"}:
                  continue
              record = json.loads(path.read_text(encoding="utf-8"))
              key = str(path.relative_to(root).with_suffix(""))
              raw = base64.b64decode(record["raw_response_base64"])
              observed = hashlib.sha256(raw).hexdigest()
              expected = record["raw_response_sha256"]
              if observed != expected:
                  raise SystemExit(f"raw response hash mismatch: {key}: {observed} != {expected}")
              responses[key] = {
                  "request_sha256": record["request_sha256"],
                  "wire_request_sha256": record["wire_request_sha256"],
                  "raw_response_sha256": expected,
                  "raw_response_base64": record["raw_response_base64"],
              }

          if len(responses) != 42:
              raise SystemExit(f"expected 42 responses, got {len(responses)}")

          bundle = {
              "schema_version": "0.2",
              "experiment": "clef-flash-phase1b-replication",
              "repair_note": (
                  "Reconstructed from digest-verified GitHub Actions artifact "
                  "11304537926 after the originally retained bundle was found "
                  "to fail gzip CRC validation."
              ),
              "run_identity": {
                  "workflow_run": 37205657656,
                  "workflow_head": "2c98622338a19f09a7926e6dcf05533a59d48a80",
                  "artifact_id": 11304537926,
                  "artifact_digest": "sha256:3cef7569014381bd33574657e892b5f1034f29281fd6c917fe0ce6b2f9752629",
                  "manifest_sha256": "b4868b760af95b080d8848db7cfe5e610eb1bf6cca110b805c89b14105a9c23a",
                  "provider": "cloudflare-workers-ai",
                  "model_alias": "@cf/cloudflare/clef-flash",
                  "hosted_immutable_model_revision": None,
              },
              "responses": responses,
          }

          raw_json = json.dumps(
              bundle,
              ensure_ascii=False,
              separators=(",", ":"),
              sort_keys=True,
          ).encode("utf-8")
          gz = gzip.compress(raw_json, mtime=0)
          b64 = base64.b64encode(gz) + b"\n"

          raw_sha = hashlib.sha256(raw_json).hexdigest()
          gz_sha = hashlib.sha256(gz).hexdigest()
          b64_sha = hashlib.sha256(b64).hexdigest()

          # Round-trip before replacing the retained evidence.
          restored = gzip.decompress(base64.b64decode(b64))
          if restored != raw_json:
              raise SystemExit("bundle round-trip failed")

          bundle_path = results / "clef-phase1b-hosted-v0.1.bundle.json.gz.b64"
          bundle_path.write_bytes(b64)

          summary_path = results / "clef-phase1b-hosted-v0.1-summary.md"
          summary = summary_path.read_text(encoding="utf-8")
          summary = summary.replace(
              "- the full Phase 1B analysis object.\n",
              "- all 42 exact provider response bodies and their request/wire hashes.\n\n"
              "The full analysis summary remains separately preserved in "
              "`clef-phase1b-hosted-v0.1-analysis-summary.json`.\n",
          )

          repair_block = f"""Integrity after repair:

- decoded gzip SHA-256:
  `{gz_sha}`
- Base64 text SHA-256:
  `{b64_sha}`
- uncompressed compact JSON SHA-256:
  `{raw_sha}`

Repair provenance:

- the previously retained bundle was found during PR #131 review to fail gzip CRC validation;
- this replacement was reconstructed from GitHub Actions Artifact `11304537926`;
- the downloaded artifact SHA-256 was rechecked against the frozen digest
  `3cef7569014381bd33574657e892b5f1034f29281fd6c917fe0ce6b2f9752629`;
- all **42 / 42** decoded raw response bodies matched their recorded
  `raw_response_sha256` before this replacement was written.

Example reconstruction:"""

          summary, count = re.subn(
              r"Integrity:\n\n- decoded gzip SHA-256:.*?Example reconstruction:",
              repair_block,
              summary,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("could not replace Phase 1B integrity block")
          summary_path.write_text(summary, encoding="utf-8")

          print(f"responses={len(responses)}")
          print(f"raw_json_sha256={raw_sha}")
          print(f"gzip_sha256={gz_sha}")
          print(f"base64_text_sha256={b64_sha}")
          PY

      - name: Commit repaired Evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             experiments/provider_portability/clef/results/clef-phase1b-hosted-v0.1.bundle.json.gz.b64             experiments/provider_portability/clef/results/clef-phase1b-hosted-v0.1-summary.md
          git diff --cached --check
          git commit -m "evidence: repair Clef-Flash Phase 1B raw bundle"
          git push origin HEAD:evidence/clef-phase1c-hosted-v0-1
